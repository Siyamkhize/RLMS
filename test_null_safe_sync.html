<!DOCTYPE html>
<html>
<head>
    <title>Test Null-Safe Learner Sync</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Null-Safe Learner Sync</h1>
        
        <div class="test-section">
            <h3>1. Test Current Learner Data (with null values)</h3>
            <button onclick="testCurrentData()">Check Current Data</button>
            <div id="currentDataResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <h3>2. Test Null-Safe Sync Endpoint</h3>
            <button onclick="testNullSafeEndpoint()">Test Null-Safe Endpoint</button>
            <div id="nullSafeResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <h3>3. Compare Original vs Null-Safe</h3>
            <button onclick="compareEndpoints()">Compare Both Endpoints</button>
            <div id="compareResult" class="result"></div>
        </div>
    </div>

    <script>
        async function testCurrentData() {
            const resultDiv = document.getElementById('currentDataResult');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('test_learner_sync_null_values.php');
                const data = await response.json();
                
                if (data.status === 'success') {
                    let html = `<div class="success">Found ${data.count} learners</div>`;
                    
                    data.learners.forEach(learner => {
                        html += `<div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;">`;
                        html += `<strong>${learner.Name} ${learner.Surname}</strong> (ID: ${learner.IDNumber})<br>`;
                        html += `Phone: ${learner.PhoneNumber || 'NULL'}<br>`;
                        html += `Class: ${learner.classID}<br>`;
                        if (learner.null_fields.length > 0) {
                            html += `<span style="color: orange;">NULL fields: ${learner.null_fields.join(', ')}</span>`;
                        } else {
                            html += `<span style="color: green;">No NULL fields</span>`;
                        }
                        html += `</div>`;
                    });
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="error">Error: ${data.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testNullSafeEndpoint() {
            const resultDiv = document.getElementById('nullSafeResult');
            resultDiv.innerHTML = 'Testing null-safe endpoint...';
            
            try {
                const response = await fetch('php/sync_learnerdetails_null_safe.php');
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    let html = `<div class="success">Null-safe endpoint returned ${data.length} learners</div>`;
                    
                    // Show first few learners
                    data.slice(0, 3).forEach(learner => {
                        html += `<div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;">`;
                        html += `<strong>${learner.Name} ${learner.Surname}</strong> (ID: ${learner.IDNumber})<br>`;
                        html += `Phone: ${learner.PhoneNumber || 'EMPTY'}<br>`;
                        html += `Class: ${learner.classID}<br>`;
                        html += `Email: ${learner.Email || 'EMPTY'}<br>`;
                        html += `Age: ${learner.Age || 'NULL'}<br>`;
                        html += `</div>`;
                    });
                    
                    if (data.length > 3) {
                        html += `<div>... and ${data.length - 3} more learners</div>`;
                    }
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="error">Unexpected response format</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function compareEndpoints() {
            const resultDiv = document.getElementById('compareResult');
            resultDiv.innerHTML = 'Comparing endpoints...';
            
            try {
                // Test original endpoint
                const originalResponse = await fetch('php/sync_learnerdetails.php');
                const originalData = await originalResponse.json();
                
                // Test null-safe endpoint
                const nullSafeResponse = await fetch('php/sync_learnerdetails_null_safe.php');
                const nullSafeData = await nullSafeResponse.json();
                
                let html = '<h4>Comparison Results:</h4>';
                html += `<div>Original endpoint: ${Array.isArray(originalData) ? originalData.length : 'Error'} learners</div>`;
                html += `<div>Null-safe endpoint: ${Array.isArray(nullSafeData) ? nullSafeData.length : 'Error'} learners</div>`;
                
                if (Array.isArray(originalData) && Array.isArray(nullSafeData)) {
                    // Compare first learner
                    if (originalData.length > 0 && nullSafeData.length > 0) {
                        html += '<h5>First learner comparison:</h5>';
                        html += '<div style="display: flex; gap: 20px;">';
                        html += '<div style="flex: 1;"><strong>Original:</strong><pre>' + JSON.stringify(originalData[0], null, 2) + '</pre></div>';
                        html += '<div style="flex: 1;"><strong>Null-safe:</strong><pre>' + JSON.stringify(nullSafeData[0], null, 2) + '</pre></div>';
                        html += '</div>';
                    }
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
