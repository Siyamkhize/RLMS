  sqflite: ^2.3.3+1
  connectivity_plus: ^6.0.5
  sqflite_common_ffi: ^2.3.3+1
  signature: ^5.5.0
  camera: ^0.11.0+2
  camera_windows: ^0.2.1+3
  path: ^1.8.1
  http: ^1.0.0
  flutter_cached_pdfview: ^0.4.3
  dotted_border: ^2.0.0
  pdf: ^3.6.0
