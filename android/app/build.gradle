plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
        namespace = "com.example.rlmss"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Load signing configuration
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file('key.properties')
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
                applicationId = "com.example.rlmss"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = 23  // Required by flutter_doc_scanner (play-services-mlkit-document-scanner)
        targetSdk = 35
        versionCode = 2
        versionName = "1.0.1+2"

        // Dex options to handle memory better
        multiDexEnabled true

        // Note: ndk abiFilters removed to allow --split-per-abi flag
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                // Fallback to debug signing if no keystore
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile file('debug.keystore')
                storePassword 'android'
            }
        }
    }

    buildTypes {
        release {
            // Use proper release signing
            signingConfig = signingConfigs.release
            
            // Disable minification to avoid R8 issues
            minifyEnabled false
            shrinkResources false
            
            // Remove test-only flag for production builds
            debuggable false
            testCoverageEnabled false
        }
        
        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            debuggable true
        }
    }

    // Copy APK to Flutter expected location
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app-${variant.name}.apk"
        }
        
        variant.assemble.doLast {
            def flutterApkDir = new File(project.rootProject.projectDir.parentFile, "build/app/outputs/flutter-apk")
            flutterApkDir.mkdirs()
            
            variant.outputs.all { output ->
                def sourceFile = output.outputFile
                def destFile = new File(flutterApkDir, output.outputFile.name)
                
                if (sourceFile.exists()) {
                    copy {
                        from sourceFile
                        into flutterApkDir
                    }
                    println "Copied APK to: ${destFile.absolutePath}"
                }
            }
        }
    }

    // Packaging options to handle native libraries
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libzkfinger10.so'
        pickFirst '**/libzksensorcore.so'
    }
    
    // Add this to handle Java compatibility issues
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }
}

flutter {
    source = "../.."
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation files('libs/zkandroidcore.jar')
    implementation files('libs/zkandroidfingerservice.jar')
    implementation files('libs/zkandroidfpsensor.jar')
    // Add Futronic SDK
    implementation(name: 'ftrScanApiAndroidHelperUsbHost-release', ext: 'aar')
    implementation(name: 'androidHelper-release', ext: 'aar')
}
