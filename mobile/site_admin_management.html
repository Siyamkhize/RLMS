<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Admin Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
        }
        
        .tab {
            padding: 15px 30px;
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #7f8c8d;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .tab.active {
            color: #2c3e50;
            border-bottom-color: #3498db;
        }
        
        .tab:hover {
            color: #2c3e50;
            background: #f8f9fa;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1rem;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #ecf0f1;
            transition: all 0.3s ease;
        }
        
        .checkbox-item:hover {
            background: #e9ecef;
            border-color: #3498db;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        
        .checkbox-item label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        
        .admin-list {
            margin-top: 30px;
        }
        
        .admin-card {
            background: #f8f9fa;
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .admin-card:hover {
            border-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .admin-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .admin-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .admin-email {
            color: #7f8c8d;
            font-size: 1rem;
        }
        
        .admin-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-weight: 600;
            color: #2c3e50;
        }
        
        .assigned-sites {
            margin-top: 15px;
        }
        
        .sites-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .site-tag {
            background: #3498db;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .admin-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .permission-card {
            background: #f8f9fa;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            padding: 15px;
        }
        
        .permission-card h4 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                text-align: left;
                border-bottom: 1px solid #ecf0f1;
                border-right: 3px solid transparent;
            }
            
            .tab.active {
                border-bottom-color: #ecf0f1;
                border-right-color: #3498db;
            }
            
            .admin-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Site Admin Management</h1>
            <p>Create and manage site administrators with site assignments</p>
        </div>
        
        <div class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('create')">Create Site Admin</button>
                <button class="tab" onclick="switchTab('list')">Manage Existing</button>
            </div>
            
            <!-- Create Site Admin Tab -->
            <div id="create-tab" class="tab-content active">
                <div id="alert-container"></div>
                
                <form id="site-admin-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first_name">First Name *</label>
                            <input type="text" id="first_name" name="first_name" required>
                        </div>
                        <div class="form-group">
                            <label for="last_name">Last Name *</label>
                            <input type="text" id="last_name" name="last_name" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password *</label>
                            <input type="password" id="password" name="password" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="permissions-grid">
                        <div class="permission-card">
                            <h4>Site Management</h4>
                            <div class="checkbox-item">
                                <input type="checkbox" id="can_manage_sites" name="can_manage_sites" checked>
                                <label for="can_manage_sites">Can Manage Sites</label>
                            </div>
                        </div>
                        
                        <div class="permission-card">
                            <h4>Learner Management</h4>
                            <div class="checkbox-item">
                                <input type="checkbox" id="can_assign_learners" name="can_assign_learners" checked>
                                <label for="can_assign_learners">Can Assign Learners</label>
                            </div>
                        </div>
                        
                        <div class="permission-card">
                            <h4>Monitoring</h4>
                            <div class="checkbox-item">
                                <input type="checkbox" id="can_view_geofencing_logs" name="can_view_geofencing_logs" checked>
                                <label for="can_view_geofencing_logs">Can View Geofencing Logs</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Assigned Sites</label>
                        <p style="color: #7f8c8d; margin-bottom: 15px;">Select sites this admin can manage. Leave none selected to allow access to all sites.</p>
                        <div id="sites-loading" class="loading">
                            <div class="spinner"></div>
                            Loading available sites...
                        </div>
                        <div id="sites-container" class="checkbox-group" style="display: none;"></div>
                    </div>
                    
                    <div style="text-align: center; margin-top: 40px;">
                        <button type="submit" class="btn btn-primary">Create Site Admin</button>
                        <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset Form</button>
                    </div>
                </form>
            </div>
            
            <!-- Manage Existing Tab -->
            <div id="list-tab" class="tab-content">
                <div id="list-alert-container"></div>
                
                <div style="margin-bottom: 30px;">
                    <button class="btn btn-primary" onclick="loadSiteAdmins()">Refresh List</button>
                </div>
                
                <div id="admins-loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    Loading site administrators...
                </div>
                
                <div id="admins-container" class="admin-list"></div>
            </div>
        </div>
    </div>

    <script>
        let availableSites = [];
        
        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
            
            // Load data if needed
            if (tabName === 'list') {
                loadSiteAdmins();
            }
        }
        
        // Load available sites
        async function loadSites() {
            try {
                // Use dedicated endpoint for loading all workplace sites (admin management)
                const response = await fetch('get_all_workplace_sites.php');
                const data = await response.json();
                
                if (data.success) {
                    availableSites = data.sites;
                    displaySites();
                } else {
                    showAlert('Error loading sites: ' + data.message, 'error');
                }
            } catch (error) {
                showAlert('Error loading sites: ' + error.message, 'error');
            }
        }
        
        // Display sites checkboxes
        function displaySites() {
            const container = document.getElementById('sites-container');
            const loading = document.getElementById('sites-loading');
            
            container.innerHTML = '';
            
            if (availableSites.length === 0) {
                container.innerHTML = '<p style="color: #7f8c8d;">No workplace sites available.</p>';
            } else {
                availableSites.forEach(site => {
                    const checkboxItem = document.createElement('div');
                    checkboxItem.className = 'checkbox-item';
                    checkboxItem.innerHTML = `
                        <input type="checkbox" id="site_${site.siteID}" name="assigned_sites[]" value="${site.siteID}">
                        <label for="site_${site.siteID}">${site.siteName} (${site.province || 'Unknown Province'})</label>
                    `;
                    container.appendChild(checkboxItem);
                });
            }
            
            loading.style.display = 'none';
            container.style.display = 'flex';
        }
        
        // Show alert message
        function showAlert(message, type = 'success', containerId = 'alert-container') {
            const container = document.getElementById(containerId);
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            
            container.innerHTML = `
                <div class="alert ${alertClass}">
                    ${message}
                </div>
            `;
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        // Reset form
        function resetForm() {
            document.getElementById('site-admin-form').reset();
            document.getElementById('alert-container').innerHTML = '';
        }
        
        // Handle form submission
        document.getElementById('site-admin-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            // Get selected sites
            const selectedSites = [];
            document.querySelectorAll('input[name="assigned_sites[]"]:checked').forEach(checkbox => {
                selectedSites.push(parseInt(checkbox.value));
            });
            
            // Add selected sites to form data
            formData.append('assigned_sites', JSON.stringify(selectedSites));
            formData.append('action', 'create_site_admin');
            
            try {
                const response = await fetch('manage_site_admins.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Site admin created successfully!', 'success');
                    resetForm();
                } else {
                    showAlert('Error: ' + data.message, 'error');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        });
        
        // Load site administrators
        async function loadSiteAdmins() {
            const container = document.getElementById('admins-container');
            const loading = document.getElementById('admins-loading');
            
            loading.style.display = 'block';
            container.innerHTML = '';
            
            try {
                const response = await fetch('manage_site_admins.php?action=list_site_admins');
                const data = await response.json();
                
                if (data.success) {
                    displaySiteAdmins(data.admins);
                } else {
                    showAlert('Error loading site admins: ' + data.message, 'error', 'list-alert-container');
                }
            } catch (error) {
                showAlert('Error loading site admins: ' + error.message, 'error', 'list-alert-container');
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // Display site administrators
        function displaySiteAdmins(admins) {
            const container = document.getElementById('admins-container');
            
            if (admins.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 40px;">No site administrators found.</p>';
                return;
            }
            
            container.innerHTML = '';
            
            admins.forEach(admin => {
                const adminCard = document.createElement('div');
                adminCard.className = 'admin-card';
                
                const assignedSites = admin.assigned_sites ? JSON.parse(admin.assigned_sites) : [];
                const siteNames = assignedSites.length > 0 
                    ? assignedSites.map(siteId => {
                        const site = availableSites.find(s => s.siteID == siteId);
                        return site ? site.siteName : `Site ${siteId}`;
                    })
                    : ['All Sites'];
                
                adminCard.innerHTML = `
                    <div class="admin-header">
                        <div>
                            <div class="admin-name">${admin.first_name} ${admin.last_name}</div>
                            <div class="admin-email">${admin.email}</div>
                        </div>
                    </div>
                    
                    <div class="admin-details">
                        <div class="detail-item">
                            <div class="detail-label">Phone</div>
                            <div class="detail-value">${admin.phone || 'Not provided'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Status</div>
                            <div class="detail-value" style="color: ${admin.status === 'active' ? '#27ae60' : '#e74c3c'}">${admin.status.toUpperCase()}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Created</div>
                            <div class="detail-value">${new Date(admin.created_at).toLocaleDateString()}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Last Login</div>
                            <div class="detail-value">${admin.last_login ? new Date(admin.last_login).toLocaleDateString() : 'Never'}</div>
                        </div>
                    </div>
                    
                    <div class="assigned-sites">
                        <div class="detail-label">Assigned Sites</div>
                        <div class="sites-list">
                            ${siteNames.map(name => `<span class="site-tag">${name}</span>`).join('')}
                        </div>
                    </div>
                    
                    <div class="admin-actions">
                        <button class="btn btn-primary" onclick="editSiteAdmin(${admin.admin_id})">Edit</button>
                        <button class="btn btn-secondary" onclick="toggleStatus(${admin.admin_id}, '${admin.status}')">
                            ${admin.status === 'active' ? 'Deactivate' : 'Activate'}
                        </button>
                        <button class="btn btn-danger" onclick="deleteSiteAdmin(${admin.admin_id}, '${admin.first_name} ${admin.last_name}')">Delete</button>
                    </div>
                `;
                
                container.appendChild(adminCard);
            });
        }
        
        // Toggle admin status
        async function toggleStatus(adminId, currentStatus) {
            const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
            
            if (!confirm(`Are you sure you want to ${newStatus === 'active' ? 'activate' : 'deactivate'} this site admin?`)) {
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('action', 'toggle_status');
                formData.append('admin_id', adminId);
                formData.append('status', newStatus);
                
                const response = await fetch('manage_site_admins.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Status updated successfully!', 'success', 'list-alert-container');
                    loadSiteAdmins();
                } else {
                    showAlert('Error: ' + data.message, 'error', 'list-alert-container');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error', 'list-alert-container');
            }
        }
        
        // Delete site admin
        async function deleteSiteAdmin(adminId, adminName) {
            if (!confirm(`Are you sure you want to delete site admin "${adminName}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const formData = new FormData();
                formData.append('action', 'delete_site_admin');
                formData.append('admin_id', adminId);
                
                const response = await fetch('manage_site_admins.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Site admin deleted successfully!', 'success', 'list-alert-container');
                    loadSiteAdmins();
                } else {
                    showAlert('Error: ' + data.message, 'error', 'list-alert-container');
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error', 'list-alert-container');
            }
        }
        
        // Edit site admin (placeholder)
        function editSiteAdmin(adminId) {
            alert('Edit functionality will be implemented in the next phase.');
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadSites();
        });
    </script>
</body>
</html>
