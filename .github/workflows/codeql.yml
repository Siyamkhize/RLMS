name: "CodeQL Security Analysis"

# Disabled temporarily due to Flutter Android build complexity
# Re-enable once Android SDK environment is properly configured
on:
  workflow_dispatch:  # Manual trigger only
  # push:
  #   branches: [ "main", "development" ]
  # pull_request:
  #   branches: [ "main", "development" ]
  # schedule:
  #   - cron: '30 2 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]
        # CodeQL supports: 'java-kotlin' for Android, 'javascript-typescript' for Dart/JS
        # Analyzing Android Java/Kotlin code for security vulnerabilities

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
