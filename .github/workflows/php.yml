name: PHP CI

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    branches: [ "main", "development" ]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, json, mysqli, pdo_mysql
          coverage: none

      - name: Validate composer.json and composer.lock
        run: |
          if [ -f composer.json ]; then
            composer validate --strict
          else
            echo "No composer.json found, skipping validation"
          fi

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress
          else
            echo "No composer.json found, skipping dependencies installation"
          fi

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep -v "No syntax errors"
          if [ $? -eq 0 ]; then
            echo "✓ All PHP files have valid syntax"
          fi

      - name: Run security checks
        run: |
          if [ -f composer.lock ]; then
            composer audit
          else
            echo "No composer.lock found, skipping security audit"
          fi
        continue-on-error: true
